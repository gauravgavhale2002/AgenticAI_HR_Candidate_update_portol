spring:
  datasource:
    url: jdbc:h2:mem:talentflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: false
      path: /h2-console
  security:
    user:
      name: ${HR_USERNAME:admin}
      password: ${HR_PASSWORD:${random.uuid}}
      roles: ADMIN

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
